<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Vulénor Akış • Fotoğraf Galerisi</title>
  <meta name="theme-color" content="#09090b">
  <style>
    :root {
      --bg: #09090b;
      --card-bg: #111115;
      --card-header: #15151b;
      --border: rgba(255, 255, 255, 0.08);
      --border-light: rgba(255, 255, 255, 0.12);
      --accent: #10b981;
      --accent-glow: rgba(16, 185, 129, 0.18);
      --text: #f4f4f5;
      --text-muted: #8e8e99;
      --text-dim: #52525b;
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 16px 60px;
      overflow-x: hidden;
    }

    /* Sticky Minimal Header */
    .sticky-header {
      position: sticky;
      top: 0;
      width: 100%;
      max-width: 640px;
      z-index: 100;
      background: rgba(9, 9, 11, 0.85);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand-area {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: inherit;
    }

    .brand-logo {
      width: 26px;
      height: 26px;
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.2), rgba(16, 185, 129, 0.05));
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
    }

    .brand-title {
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #fff;
    }

    .brand-badge {
      font-size: 0.68rem;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 100px;
      background: var(--accent-glow);
      color: var(--accent);
      border: 1px solid rgba(16, 185, 129, 0.25);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .scroll-indicator {
      font-size: 0.76rem;
      font-weight: 600;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.05);
      padding: 4px 10px;
      border-radius: 100px;
      border: 1px solid var(--border);
    }

    .header-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      color: var(--text);
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .header-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: var(--accent);
      color: var(--accent);
    }

    /* Feed Container */
    .feed-container {
      width: 100%;
      max-width: 640px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* Photo Card */
    .photo-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .card-top {
      padding: 10px 16px;
      background: var(--card-header);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .photo-idx {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.05em;
    }

    .photo-cdn-tag {
      font-size: 0.68rem;
      color: var(--text-dim);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    .image-wrapper {
      position: relative;
      background: #000;
      min-height: 240px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: zoom-in;
    }

    .image-wrapper img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: contain;
      transition: opacity 0.3s ease;
    }

    .image-wrapper img.loading {
      opacity: 0;
    }

    .image-skeleton {
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, #111115 25%, #18181f 50%, #111115 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
    }

    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .card-bottom {
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid var(--border);
      background: var(--card-header);
    }

    .action-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.78rem;
      font-weight: 500;
      padding: 6px 12px;
      border-radius: 7px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      color: var(--text);
      text-decoration: none;
      cursor: pointer;
      transition: all 0.2s;
    }

    .action-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--accent);
      color: var(--accent);
    }

    .action-btn svg {
      width: 14px;
      height: 14px;
    }

    /* Lightbox Modal */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.94);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      z-index: 1000;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .lightbox.active {
      display: flex;
    }

    .lightbox-close {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 1010;
    }

    .lightbox-counter {
      position: absolute;
      top: 24px;
      left: 24px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.08);
      padding: 4px 12px;
      border-radius: 100px;
    }

    .lightbox-img-box {
      max-width: 95vw;
      max-height: 85vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .lightbox-img {
      max-width: 100%;
      max-height: 85vh;
      object-fit: contain;
      border-radius: 8px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
    }

    /* Empty state */
    .empty-state {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 48px 24px;
      text-align: center;
      max-width: 480px;
      margin: 40px auto 0;
    }

    .empty-icon {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      background: rgba(16, 185, 129, 0.1);
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
    }

    .empty-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .empty-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 20px;
    }

    .btn-create-qr {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--accent);
      color: #000;
      font-weight: 600;
      font-size: 0.85rem;
      padding: 10px 20px;
      border-radius: 8px;
      text-decoration: none;
      transition: opacity 0.2s;
    }

    .btn-create-qr:hover {
      opacity: 0.9;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      background: #18181f;
      border: 1px solid var(--border-light);
      color: #fff;
      font-size: 0.82rem;
      padding: 10px 18px;
      border-radius: 100px;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      opacity: 0;
      transform: translateY(16px);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 2000;
      pointer-events: none;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <!-- Sticky Top Header -->
  <header class="sticky-header">
    <a href="https://vulenor.com" class="brand-area" target="_blank" rel="noopener">
      <div class="brand-logo">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
          <rect x="3" y="3" width="7" height="7" rx="1.5"></rect>
          <rect x="14" y="3" width="7" height="7" rx="1.5"></rect>
          <rect x="3" y="14" width="7" height="7" rx="1.5"></rect>
          <rect x="14" y="14" width="7" height="7" rx="1.5"></rect>
        </svg>
      </div>
      <span class="brand-title">Vulénor Akış</span>
      <span class="brand-badge">GALERİ</span>
    </a>

    <div class="header-actions">
      <div class="scroll-indicator" id="scroll-counter">1 / 1</div>
      <button class="header-btn" id="btn-share" title="Bağlantıyı Paylaş / Kopyala">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="18" cy="5" r="3"></circle>
          <circle cx="6" cy="12" r="3"></circle>
          <circle cx="18" cy="19" r="3"></circle>
          <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
          <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
        </svg>
      </button>
    </div>
  </header>

  <!-- Feed Stack -->
  <main class="feed-container" id="feed-container">
    <!-- Populated by JavaScript -->
  </main>

  <!-- Lightbox Modal -->
  <div class="lightbox" id="lightbox">
    <div class="lightbox-counter" id="lightbox-counter">1 / 1</div>
    <button class="lightbox-close" id="lightbox-close" title="Kapat">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
    <div class="lightbox-img-box">
      <img src="" alt="Tam Boyut" class="lightbox-img" id="lightbox-img">
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast">
    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="#10b981" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>
    <span id="toast-text">Bağlantı kopyalandı!</span>
  </div>

  <script>
    const CDN_BASE = 'https://raw.githubusercontent.com/starvays0/vulenor-cdn/main/images/';
    const feedContainer = document.getElementById('feed-container');
    const scrollCounter = document.getElementById('scroll-counter');
    const btnShare = document.getElementById('btn-share');
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    const lightboxCounter = document.getElementById('lightbox-counter');
    const lightboxClose = document.getElementById('lightbox-close');
    const toast = document.getElementById('toast');
    const toastText = document.getElementById('toast-text');

    function showToast(msg) {
      toastText.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2600);
    }

    // Extract photo IDs from query params ?p=id1,id2,id3 or hash #p=id1,id2
    function getPhotoIds() {
      const urlParams = new URLSearchParams(window.location.search);
      let p = urlParams.get('p');
      if (!p && window.location.hash) {
        const hashParams = new URLSearchParams(window.location.hash.substring(1));
        p = hashParams.get('p');
      }
      if (!p) return [];
      return p.split(',')
        .map(s => s.trim())
        .filter(s => s.length > 0 && /^[a-zA-Z0-9_\-\.]+$/.test(s));
    }

    const photoIds = getPhotoIds();

    if (photoIds.length === 0) {
      // Empty State
      feedContainer.innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">
            <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
              <circle cx="8.5" cy="8.5" r="1.5"></circle>
              <polyline points="21 15 16 10 5 21"></polyline>
            </svg>
          </div>
          <div class="empty-title">Akışta Fotoğraf Bulunamadı</div>
          <div class="empty-desc">Bu galeri bağlantısında gösterilecek fotoğraf tanımlanmamış veya bağlantı eksik.</div>
          <a href="/" class="btn-create-qr">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
              <rect x="3" y="3" width="7" height="7" rx="1.5"></rect>
              <rect x="14" y="3" width="7" height="7" rx="1.5"></rect>
              <rect x="3" y="14" width="7" height="7" rx="1.5"></rect>
              <rect x="14" y="14" width="7" height="7" rx="1.5"></rect>
            </svg>
            Yeni QR & Galeri Oluştur
          </a>
        </div>
      `;
      scrollCounter.textContent = '0 / 0';
    } else {
      scrollCounter.textContent = `1 / ${photoIds.length}`;

      photoIds.forEach((id, index) => {
        const imgUrl = `${CDN_BASE}${id}`;
        const card = document.createElement('article');
        card.className = 'photo-card';
        card.setAttribute('data-index', index + 1);

        card.innerHTML = `
          <div class="card-top">
            <span class="photo-idx">FOTOĞRAF #${String(index + 1).padStart(2, '0')}</span>
            <span class="photo-cdn-tag">${id.length > 20 ? id.substring(0, 16) + '...' : id}</span>
          </div>
          <div class="image-wrapper" data-url="${imgUrl}" data-index="${index + 1}">
            <div class="image-skeleton"></div>
            <img class="loading" src="${imgUrl}" alt="Vulénor Görsel ${index + 1}" loading="lazy">
          </div>
          <div class="card-bottom">
            <button class="action-btn btn-zoom" data-url="${imgUrl}" data-index="${index + 1}">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                <line x1="11" y1="8" x2="11" y2="14"></line>
                <line x1="8" y1="11" x2="14" y2="11"></line>
              </svg>
              Tam Ekran
            </button>
            <a href="${imgUrl}" target="_blank" download rel="noopener" class="action-btn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="7 10 12 15 17 10"></polyline>
                <line x1="12" y1="15" x2="12" y2="3"></line>
              </svg>
              Orijinali İndir
            </a>
          </div>
        `;

        const imgEl = card.querySelector('img');
        const skeleton = card.querySelector('.image-skeleton');
        imgEl.addEventListener('load', () => {
          imgEl.classList.remove('loading');
          if (skeleton) skeleton.remove();
        });
        imgEl.addEventListener('error', () => {
          if (skeleton) skeleton.remove();
          card.querySelector('.image-wrapper').innerHTML = `
            <div style="padding: 40px 20px; text-align: center; color: var(--text-muted); font-size: 0.8rem;">
              Görsel yüklenemedi veya silinmiş olabilir.
            </div>
          `;
        });

        // Click zoom
        card.querySelector('.image-wrapper').addEventListener('click', () => {
          openLightbox(imgUrl, index + 1);
        });
        card.querySelector('.btn-zoom').addEventListener('click', (e) => {
          e.stopPropagation();
          openLightbox(imgUrl, index + 1);
        });

        feedContainer.appendChild(card);
      });

      // Intersection Observer for scroll counter update
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            const idx = entry.target.getAttribute('data-index');
            scrollCounter.textContent = `${idx} / ${photoIds.length}`;
          }
        });
      }, {
        threshold: 0.5
      });

      document.querySelectorAll('.photo-card').forEach(c => observer.observe(c));
    }

    // Lightbox Controls
    function openLightbox(url, idx) {
      lightboxImg.src = url;
      lightboxCounter.textContent = `${idx} / ${photoIds.length}`;
      lightbox.classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      lightbox.classList.remove('active');
      lightboxImg.src = '';
      document.body.style.overflow = '';
    }

    lightboxClose.addEventListener('click', closeLightbox);
    lightbox.addEventListener('click', (e) => {
      if (e.target === lightbox || e.target === lightbox.querySelector('.lightbox-img-box')) {
        closeLightbox();
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && lightbox.classList.contains('active')) {
        closeLightbox();
      }
    });

    // Share / Copy Link
    btnShare.addEventListener('click', () => {
      const url = window.location.href;
      if (navigator.share) {
        navigator.share({
          title: 'Vulénor Akış • Fotoğraf Galerisi',
          url: url
        }).catch(() => {});
      } else {
        navigator.clipboard.writeText(url).then(() => {
          showToast('Galeri bağlantısı panoya kopyalandı!');
        });
      }
    });
  </script>
</body>
</html>
